# Local development: builds the agent from source.
#   cp .env.example .env && docker compose up --build
# Then: curl -H "Authorization: Bearer change-me" http://127.0.0.1:7070/api/v1/version
services:
  agent:
    build: ./agent
    environment:
      GANTRY_TOKEN: ${GANTRY_TOKEN:?set GANTRY_TOKEN}
    ports:
      - "127.0.0.1:7070:7070"
    # Uncomment once the agent talks to Docker. Access to the socket is
    # root-equivalent on the host, which is why the API requires a token.
    # volumes:
    #   - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
