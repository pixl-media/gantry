# Local development with the agent and the web UI in containers, managing
# dev/stacks. Run from the repo root (`make .env` creates .env with a random
# token if there is none yet):
#   make .env && docker compose up --build
# Web UI: http://127.0.0.1:8080 (log in with the token from .env)
# API:    curl -H "Authorization: Bearer $(sed -n 's/^GANTRY_TOKEN=//p' .env)" http://127.0.0.1:7070/api/v1/stacks
services:
  agent:
    build: ./agent
    environment:
      GANTRY_TOKEN: ${GANTRY_TOKEN:?set GANTRY_TOKEN}
      GANTRY_STACKS_DIR: ${PWD}/dev/stacks
    ports:
      - "127.0.0.1:7070:7070"
    volumes:
      # Access to the socket is root-equivalent on the host, which is why
      # the API requires a token.
      - /var/run/docker.sock:/var/run/docker.sock
      # Same path inside and outside: Docker resolves relative bind mounts of
      # stacks (e.g. ./data) on the host, using the path the agent passes.
      - ${PWD}/dev/stacks:${PWD}/dev/stacks
    restart: unless-stopped

  web:
    build: ./web
    environment:
      GANTRY_AGENT_URL: http://agent:7070
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - agent
    restart: unless-stopped
