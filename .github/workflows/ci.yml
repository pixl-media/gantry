name: CI

# GitHub Flow: PRs into main are tested and the image is built and smoke-tested
# (not pushed). A push to main publishes :edge, a tag vX.Y.Z publishes :X.Y.Z,
# :X.Y and :latest.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "Not gofmt'ed:"; echo "$unformatted"; exit 1; fi
      - name: Generated code matches api/openapi.yaml
        run: |
          go generate ./...
          git diff --exit-code || { echo "Run 'make generate' and commit the result."; exit 1; }
      - run: go vet ./...
      - run: go vet -tags integration ./...
      - run: go test -race ./...

  integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - run: docker version && docker compose version
      - run: go test -tags integration -race -count=1 ./...

  image:
    needs: [test, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      # Smoke test: run the real image like a user would, with the Docker
      # socket and the dev stacks mounted at the same path as on the host.
      - name: Build image for smoke test (amd64)
        uses: docker/build-push-action@v7
        with:
          context: agent
          platforms: linux/amd64
          load: true
          tags: gantry-agent:smoke
          cache-from: type=gha
      - name: Smoke test
        run: |
          stacks="$PWD/dev/stacks"
          docker run -d --name gantry-smoke \
            -e GANTRY_TOKEN=smoke -e GANTRY_STACKS_DIR="$stacks" \
            -v /var/run/docker.sock:/var/run/docker.sock -v "$stacks:$stacks" \
            -p 127.0.0.1:7070:7070 gantry-agent:smoke
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:7070/healthz && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:7070/api/v1/stacks)" = 401
          curl -fsS -H "Authorization: Bearer smoke" http://127.0.0.1:7070/api/v1/stacks | tee stacks.json
          # servicesTotal comes from `docker compose config` inside the image.
          jq -e '.dockerAvailable and (.stacks[] | select(.name == "whoami") | .servicesTotal == 1)' stacks.json
      - name: Smoke test logs
        if: always()
        run: docker logs gantry-smoke || true

      - if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/gantry-agent
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=pr
      - uses: docker/build-push-action@v7
        with:
          context: agent
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
