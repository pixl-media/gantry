name: CI

# GitHub Flow: PRs into main are tested and the images are built and
# smoke-tested (not pushed). A push to main publishes :edge, a tag vX.Y.Z
# publishes :X.Y.Z, :X.Y and :latest, for gantry-agent and gantry-web.
# Actions are pinned by commit and base images by digest; Dependabot keeps
# both current.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "Not gofmt'ed:"; echo "$unformatted"; exit 1; fi
      - name: Generated code matches api/openapi.yaml
        run: |
          go generate ./...
          git diff --exit-code || { echo "Run 'make generate' and commit the result."; exit 1; }
      - run: go vet ./...
      - run: go vet -tags integration ./...
      - run: go test -race ./...

  integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - run: docker version && docker compose version
      - run: go test -tags integration -race -count=1 ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Generated API types match api/openapi.yaml
        run: |
          pnpm generate
          git diff --exit-code -- src/api/schema.gen.ts || { echo "Run 'make web-generate' and commit the result."; exit 1; }
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # The release binaries and .deb/.rpm packages (GoReleaser, snapshot), and
  # the .deb installed on the runner like on a server: with systemd and
  # Docker, then upgraded and removed.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.20.2
          args: release --snapshot --clean
      - name: Install, upgrade and remove the .deb
        run: |
          deb=$(ls dist/gantry-agent_*_amd64.deb)
          # No recommends: the runner's Docker stays as it is.
          sudo apt-get install -y --no-install-recommends "./$deb"
          gantry-agent --version
          if ! systemctl is-active --quiet gantry-agent; then
            sudo journalctl -u gantry-agent --no-pager
            exit 1
          fi
          test "$(sudo stat -c '%a %U %G' /etc/gantry/gantry.env)" = "640 root gantry"
          api=$(sudo sed -n 's/^GANTRY_TOKEN=//p' /etc/gantry/gantry.env)
          ui=$(sudo sed -n 's/^GANTRY_UI_TOKEN=//p' /etc/gantry/gantry.env)
          test "${#api}" -ge 24 && test "${#ui}" -ge 24 && test "$api" != "$ui"
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:7070/healthz && break; sleep 1; done
          curl -fsS -H "Authorization: Bearer $api" http://127.0.0.1:7070/api/v1/stacks \
            | jq -e '.dockerAvailable and .fileAccess.user == "gantry" and .fileAccess.missing == []'
          curl -fsS -H "Authorization: Bearer $api" http://127.0.0.1:7070/api/v1/info \
            | jq -e '.dockerAvailable and .hostname and .dockerVersion and .composeVersion'

          # A stack that belongs to root, as from another tool: the service,
          # running as gantry, reports what it may not do, and the suggested
          # owner change (not recursive) fixes it.
          sudo install -d -m 0755 /opt/stacks/rooted
          printf 'services:\n  app:\n    image: traefik/whoami:v1.12\n' | sudo tee /opt/stacks/rooted/compose.yaml > /dev/null
          echo 'SECRET=x' | sudo tee /opt/stacks/rooted/.env > /dev/null
          sudo chmod 600 /opt/stacks/rooted/.env
          curl -fsS -H "Authorization: Bearer $api" http://127.0.0.1:7070/api/v1/stacks/rooted | tee rooted.json \
            | jq -e '.editable == false and .deletable == false and
                ([.fileAccess.missing[] | "\(.access) \(.path)"] == ["write /opt/stacks/rooted", "read /opt/stacks/rooted/.env"])'
          sudo chown gantry /opt/stacks/rooted /opt/stacks/rooted/.env
          curl -fsS -H "Authorization: Bearer $api" http://127.0.0.1:7070/api/v1/stacks/rooted \
            | jq -e '.editable and .deletable and .fileAccess.missing == []'
          sudo rm -rf /opt/stacks/rooted

          # An upgrade keeps the settings and restarts the service.
          sudo apt-get install -y --no-install-recommends --reinstall "./$deb"
          test "$(sudo sed -n 's/^GANTRY_TOKEN=//p' /etc/gantry/gantry.env)" = "$api"
          systemctl is-active --quiet gantry-agent

          # Removing stops it and keeps the settings.
          sudo apt-get remove -y gantry-agent
          if systemctl is-active --quiet gantry-agent; then
            echo "gantry-agent still runs after removal"
            exit 1
          fi
          sudo test -f /etc/gantry/gantry.env
      - name: Service log
        if: always()
        run: sudo journalctl -u gantry-agent --no-pager || true

  image:
    needs: [test, integration, web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Provenance attestations for the pushed images (public repo only).
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Smoke test: run the real images like a user would. The agent gets the
      # Docker socket and the dev stacks at the same path as on the host; the
      # web UI forwards /api to it.
      - name: Build agent image for smoke test (amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: agent
          platforms: linux/amd64
          load: true
          tags: gantry-agent:smoke
          cache-from: type=gha,scope=agent
      - name: Build web image for smoke test (amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: web
          platforms: linux/amd64
          load: true
          tags: gantry-web:smoke
          cache-from: type=gha,scope=web
      - name: Smoke test
        run: |
          stacks="$PWD/dev/stacks"
          token=$(openssl rand -hex 24)
          ui_token=$(openssl rand -hex 24)
          docker network create gantry-smoke
          docker run -d --name gantry-smoke --network gantry-smoke --network-alias agent \
            -e GANTRY_TOKEN="$token" -e GANTRY_UI_TOKEN="$ui_token" -e GANTRY_STACKS_DIR="$stacks" \
            -v /var/run/docker.sock:/var/run/docker.sock -v "$stacks:$stacks" \
            -p 127.0.0.1:7070:7070 gantry-agent:smoke
          docker run -d --name gantry-web-smoke --network gantry-smoke \
            -e GANTRY_AGENT_URL=http://agent:7070 \
            -p 127.0.0.1:8080:8080 gantry-web:smoke
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:7070/healthz && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:7070/api/v1/stacks)" = 401
          curl -fsS -H "Authorization: Bearer $token" http://127.0.0.1:7070/api/v1/stacks | tee stacks.json
          # servicesTotal comes from `docker compose config` inside the image.
          jq -e '.dockerAvailable and (.stacks[] | select(.name == "whoami") | .servicesTotal == 1)' stacks.json
          # Host details, with Compose from inside the image; never public.
          curl -fsS -H "Authorization: Bearer $token" http://127.0.0.1:7070/api/v1/info \
            | jq -e '.dockerAvailable and .hostname and .dockerVersion and .composeVersion'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:7070/api/v1/info)" = 401
          # Volume sizes, measured by Docker; never public.
          curl -fsS -H "Authorization: Bearer $token" http://127.0.0.1:7070/api/v1/volumes | jq -e '.measuredAt and (.volumes | type == "array")'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:7070/api/v1/volumes)" = 401

          # Actions: the agent in the container runs `docker compose` itself.
          api() { curl -fsS -H "Authorization: Bearer $token" "$@"; }
          follow_op() {
            id=$1
            for i in $(seq 1 120); do
              status=$(api "http://127.0.0.1:7070/api/v1/operations/$id" | jq -r .status)
              [ "$status" != running ] && break
              sleep 1
            done
            api "http://127.0.0.1:7070/api/v1/operations/$id" > op.json
            jq -r .output op.json
            jq -e '.status == "succeeded"' op.json
          }
          run_action() {
            follow_op "$(api -X POST "http://127.0.0.1:7070/api/v1/stacks/$1/actions/$2" | jq -r .id)"
          }
          run_action whoami start
          run_action bind-demo start
          # One service: whoami has no dependencies, so it runs without
          # confirmation.
          follow_op "$(api -X POST http://127.0.0.1:7070/api/v1/stacks/whoami/services/whoami/actions/restart | jq -r .id)"
          jq -e '.service == "whoami" and .services == ["whoami"]' op.json
          # bind-demo writes ./data/started.txt. It must appear on this host,
          # which only works with the identical-path mount of the stacks dir.
          test -f "$stacks/bind-demo/data/started.txt"
          api http://127.0.0.1:7070/api/v1/stacks \
            | jq -e '[.stacks[] | select(.name == "whoami" or .name == "bind-demo") | .status] == ["running", "running"]'
          run_action whoami down
          run_action bind-demo down

          # Web UI: serves the app, also for client-side routes, with a CSP.
          web=http://127.0.0.1:8080
          for i in $(seq 1 30); do curl -fsS "$web/" > /dev/null && break; sleep 1; done
          curl -fsS "$web/" | grep -q '<div id="root">'
          curl -fsS "$web/stacks/whoami" | grep -q '<div id="root">'
          curl -fsSI "$web/" | grep -qi '^content-security-policy:'
          # Through its proxy: no access without a session...
          test "$(curl -s -o /dev/null -w '%{http_code}' "$web/api/v1/stacks")" = 401
          # ...each token works only in its own place...
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "Origin: $web" -H "Content-Type: application/json" \
            -d "{\"token\":\"$token\"}" "$web/api/v1/session")" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $ui_token" "$web/api/v1/stacks")" = 401
          # ...log in, then the session cookie works...
          curl -fsS -c cookies.txt -H "Origin: $web" -H "Content-Type: application/json" \
            -d "{\"token\":\"$ui_token\"}" "$web/api/v1/session"
          grep -q gantry_session cookies.txt
          curl -fsS -b cookies.txt "$web/api/v1/stacks" | jq -e '.stacks | length > 0'
          # ...and changing requests need the page's Origin (CSRF protection).
          test "$(curl -s -o /dev/null -w '%{http_code}' -b cookies.txt -X POST "$web/api/v1/stacks/whoami/actions/start")" = 403
          id=$(curl -fsS -b cookies.txt -H "Origin: $web" -X POST "$web/api/v1/stacks/whoami/actions/start" | jq -r .id)
          for i in $(seq 1 60); do
            status=$(curl -fsS -b cookies.txt "$web/api/v1/operations/$id" | jq -r .status)
            [ "$status" != running ] && break
            sleep 1
          done
          test "$status" = succeeded

          # Logs through the proxy: whoami's startup message, then the end
          # of the past lines.
          sleep 1
          curl -fsS -b cookies.txt "$web/api/v1/stacks/whoami/logs?follow=false&tail=20" | tee logs.txt
          grep -q '^event: end' logs.txt
          grep -q '"service":"whoami"' logs.txt

          # Live changes through the proxy: the event stream arrives
          # unbuffered (ready shows up while it is still open) and names the
          # stack an action changed.
          curl -sN -b cookies.txt --max-time 30 "$web/api/v1/events" > events.txt &
          events_pid=$!
          for i in $(seq 1 10); do grep -q '^event: ready' events.txt && break; sleep 1; done
          grep -q '^event: ready' events.txt
          id=$(curl -fsS -b cookies.txt -H "Origin: $web" -X POST "$web/api/v1/stacks/whoami/actions/restart" | jq -r .id)
          for i in $(seq 1 20); do grep -q '"stacks":\[[^]]*"whoami"' events.txt && break; sleep 1; done
          kill "$events_pid" 2>/dev/null || true
          cat events.txt
          grep -q '"stacks":\[[^]]*"whoami"' events.txt
          for i in $(seq 1 60); do
            status=$(curl -fsS -b cookies.txt "$web/api/v1/operations/$id" | jq -r .status)
            [ "$status" != running ] && break
            sleep 1
          done
          test "$status" = succeeded

          # Editing through the proxy: the agent in the container writes to
          # the mounted stacks dir. Create a stack, change its compose file
          # (a stale version is refused), then delete it.
          web_api() { curl -fsS -b cookies.txt -H "Origin: $web" -H "Content-Type: application/json" "$@"; }
          web_api -d '{"name":"smoke-edit","compose":"services:\n  app:\n    image: traefik/whoami:v1.12\n"}' \
            "$web/api/v1/stacks"
          test -f "$stacks/smoke-edit/compose.yaml"
          version=$(web_api "$web/api/v1/stacks/smoke-edit" | jq -r .composeFile.version)
          update() {
            jq -n --arg v "$1" '{version: $v, content: "services:\n  app:\n    image: traefik/whoami:v1.12\n    restart: unless-stopped\n"}'
          }
          web_api -X PUT -d "$(update "$version")" "$web/api/v1/stacks/smoke-edit/compose"
          grep -q 'restart: unless-stopped' "$stacks/smoke-edit/compose.yaml"
          test "$(curl -s -o /dev/null -w '%{http_code}' -b cookies.txt -H "Origin: $web" -H "Content-Type: application/json" \
            -X PUT -d "$(update "$version")" "$web/api/v1/stacks/smoke-edit/compose")" = 409
          id=$(web_api -X DELETE "$web/api/v1/stacks/smoke-edit?confirm=smoke-edit" | jq -r .id)
          for i in $(seq 1 60); do
            status=$(web_api "$web/api/v1/operations/$id" | jq -r .status)
            [ "$status" != running ] && break
            sleep 1
          done
          test "$status" = succeeded
          test ! -e "$stacks/smoke-edit"
          test "$(curl -s -o /dev/null -w '%{http_code}' -b cookies.txt "$web/api/v1/stacks/smoke-edit")" = 404
      - name: Smoke test with TLS in the agent
        run: |
          stacks="$PWD/dev/stacks"
          tls="$RUNNER_TEMP/tls"
          mkdir -p "$tls"
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -days 1 -subj /CN=gantry \
            -addext "subjectAltName=DNS:agent-tls,DNS:localhost,IP:127.0.0.1" \
            -keyout "$tls/key.pem" -out "$tls/cert.pem"
          chmod 644 "$tls/cert.pem"
          token=$(openssl rand -hex 24)
          ui_token=$(openssl rand -hex 24)
          docker run -d --name gantry-tls-smoke --network gantry-smoke --network-alias agent-tls \
            -e GANTRY_TOKEN="$token" -e GANTRY_UI_TOKEN="$ui_token" -e GANTRY_STACKS_DIR="$stacks" \
            -e GANTRY_TLS_CERT=/tls/cert.pem -e GANTRY_TLS_KEY=/tls/key.pem \
            -v /var/run/docker.sock:/var/run/docker.sock -v "$stacks:$stacks" -v "$tls:/tls:ro" \
            -p 127.0.0.1:7443:7070 gantry-agent:smoke
          docker run -d --name gantry-web-tls-smoke --network gantry-smoke \
            -e GANTRY_AGENT_URL=https://agent-tls:7070 -e SSL_CERT_FILE=/tls/cert.pem \
            -v "$tls/cert.pem:/tls/cert.pem:ro" -p 127.0.0.1:8443:8080 gantry-web:smoke
          for i in $(seq 1 30); do curl -fsS --cacert "$tls/cert.pem" https://127.0.0.1:7443/healthz && break; sleep 1; done
          curl -fsS --cacert "$tls/cert.pem" -H "Authorization: Bearer $token" https://127.0.0.1:7443/api/v1/stacks | jq -e .dockerAvailable
          # Plain HTTP on the TLS port gets nowhere.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:7443/healthz)" = 400
          # The web UI talks HTTPS to the agent. The browser's way is plain
          # HTTP, so the session cookie must not be Secure.
          web=http://127.0.0.1:8443
          for i in $(seq 1 30); do curl -fsS "$web/" > /dev/null && break; sleep 1; done
          curl -fsS -c tls-cookies.txt -H "Origin: $web" -H "Content-Type: application/json" \
            -d "{\"token\":\"$ui_token\"}" "$web/api/v1/session"
          grep gantry_session tls-cookies.txt | awk '{ exit $4 != "FALSE" }'
          curl -fsS -b tls-cookies.txt "$web/api/v1/stacks" | jq -e '.stacks | length > 0'
          curl -sN -b tls-cookies.txt --max-time 5 "$web/api/v1/events" > tls-events.txt || true
          grep -q '^event: ready' tls-events.txt

          # The web UI in the host's network on another port, with the agent
          # on 127.0.0.1 (as installed by the package).
          docker run -d --name gantry-web-host-smoke --network host \
            -e GANTRY_AGENT_URL=http://127.0.0.1:7070 -e GANTRY_WEB_PORT=8091 gantry-web:smoke
          web=http://127.0.0.1:8091
          for i in $(seq 1 30); do curl -fsS "$web/" > /dev/null && break; sleep 1; done
          curl -fsS "$web/" | grep -q '<div id="root">'
          # 401 comes from the agent, so the proxy reached it.
          test "$(curl -s -o /dev/null -w '%{http_code}' "$web/api/v1/stacks")" = 401
      - name: Smoke test logs
        if: always()
        run: |
          docker logs gantry-smoke || true
          docker logs gantry-web-smoke || true
          docker logs gantry-tls-smoke || true
          docker logs gantry-web-tls-smoke || true
          docker logs gantry-web-host-smoke || true

      - if: github.event_name == 'push'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: agent-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/gantry-agent
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=pr
      - name: Build agent image (amd64, arm64)
        id: agent-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: agent
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.agent-meta.outputs.tags }}
          labels: ${{ steps.agent-meta.outputs.labels }}
          build-args: VERSION=${{ steps.agent-meta.outputs.version }}
          cache-from: type=gha,scope=agent
          cache-to: type=gha,mode=max,scope=agent

      - id: web-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/gantry-web
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=pr
      - name: Build web image (amd64, arm64)
        id: web-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: web
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.web-meta.outputs.tags }}
          labels: ${{ steps.web-meta.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      # Signed build provenance for each pushed image, stored with it in the
      # registry: `gh attestation verify oci://ghcr.io/pixl-media/gantry-agent:<tag>
      # -R pixl-media/gantry`. GitHub offers this for public repositories.
      - name: Attest agent image
        if: github.event_name == 'push' && github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/gantry-agent
          subject-digest: ${{ steps.agent-push.outputs.digest }}
          push-to-registry: true
      - name: Attest web image
        if: github.event_name == 'push' && github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/gantry-web
          subject-digest: ${{ steps.web-push.outputs.digest }}
          push-to-registry: true

  # A tag vX.Y.Z: the GitHub release with notes from git-cliff, binaries,
  # .deb/.rpm packages and checksums, each with signed build provenance.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [image, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: Release notes
        run: npx --yes git-cliff@2.13.1 --latest --strip all > "$RUNNER_TEMP/notes.md"
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.20.2
          args: release --clean --release-notes ${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/checksums.txt
