openapi: 3.0.3
info:
  title: gantry agent API
  description: |
    HTTP API of the gantry agent, which runs on a Docker host and manages its
    Compose stacks.

    Routes under `/api/` require authentication, either
    `Authorization: Bearer <GANTRY_TOKEN>` (API clients) or the
    `gantry_session` cookie set by `POST /api/v1/session` with
    `GANTRY_UI_TOKEN` (the web UI). The two tokens are separate: each works
    only in its own place.
    The web UI can also log in through an identity provider (OIDC, `GET
    /api/v1/session/oidc`), which sets the same cookie.
    `/healthz`, `POST /api/v1/session`, `DELETE /api/v1/session` and the
    `/api/v1/session/methods` and `/api/v1/session/oidc` routes are public.

    With cookie authentication, changing requests (POST, DELETE) must send an
    `Origin` header matching the host; otherwise they get `403
    origin_rejected`. This protects against cross-site request forgery.

    This file is the contract: the Go server types are generated from it
    (`make generate`), and API clients should be generated from it too.
  version: 0.1.0

servers:
  - url: /
    description: Same origin as this document (e.g. the dev docs from `make docs`)
  - url: http://127.0.0.1:7070
    description: Agent on localhost with the default port

security:
  - bearerAuth: []
  - cookieAuth: []

tags:
  - name: system
  - name: session
  - name: stacks
  - name: operations

paths:
  /healthz:
    get:
      operationId: getHealth
      tags: [system]
      summary: Liveness check
      description: |
        Returns 200 as long as the agent process serves requests, **including
        when Docker is unreachable**, so that monitors don't restart the agent
        while it is the one reporting the outage. Docker's state is reported
        by the API (`dockerAvailable`).
      security: []
      responses:
        "200":
          description: The agent is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /api/v1/version:
    get:
      operationId: getVersion
      tags: [system]
      summary: Agent version
      responses:
        "200":
          description: The agent's version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/info:
    get:
      operationId: getInfo
      tags: [system]
      summary: Agent and host
      description: |
        The agent's version and its Docker host: name, system, Docker and
        Compose versions, for overviews of several hosts. Host details come
        from Docker, so they describe the host also when the agent runs in a
        container. Fields whose source is unavailable are left out: without
        Docker, `dockerAvailable` is false and only `version` and
        `composeVersion` may be set. No addresses: clients know the one they
        reached the agent at.
      responses:
        "200":
          description: The agent and its host.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/session:
    get:
      operationId: getSession
      tags: [session]
      summary: Current authentication
      description: Tells clients such as the web UI whether they are logged in.
      responses:
        "200":
          description: Authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createSession
      tags: [session]
      summary: Log in
      description: |
        Exchanges the web login token (`GANTRY_UI_TOKEN`, not the API's
        `GANTRY_TOKEN`) for a session cookie (`HttpOnly`, `SameSite=Strict`,
        valid for 12 hours). Browsers never need to store the token itself. Sessions live in the agent's memory: logging out
        ends a session at once, and restarting the agent ends all of them.

        At most 10 failed attempts per minute and client address; after
        that, `429 too_many_attempts` with `Retry-After`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "204":
          description: Logged in; the session cookie is set.
          headers:
            Set-Cookie:
              description: The `gantry_session` cookie.
              schema:
                type: string
        "400":
          description: The request body is not valid JSON.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "`invalid_token`: wrong token (also the API token)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >-
            `origin_rejected`: sent from another site. `https_required`: sent
            over plain HTTP from an internet address. `login_disabled`: the
            agent has no `GANTRY_UI_TOKEN`, so the web login is off.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/TooLarge"
        "429":
          description: "`too_many_attempts`: wait `Retry-After` seconds."
          headers:
            Retry-After:
              description: Seconds until the next attempt is allowed.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteSession
      tags: [session]
      summary: Log out
      description: Clears the session cookie. Works with an expired session too.
      security: []
      responses:
        "204":
          description: Logged out; the cookie is cleared.
          headers:
            Set-Cookie:
              description: An expired `gantry_session` cookie.
              schema:
                type: string

  /api/v1/session/methods:
    get:
      operationId: getLoginMethods
      tags: [session]
      summary: Ways to log in
      description: |
        Which ways into the web UI the agent offers, so the login page shows
        only those: the web login token (`GANTRY_UI_TOKEN`) and single
        sign-on through an identity provider (`GANTRY_OIDC_*`).
      security: []
      responses:
        "200":
          description: The ways to log in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginMethods"

  /api/v1/session/oidc:
    get:
      operationId: startOidcLogin
      tags: [session]
      summary: Log in with single sign-on
      description: |
        For browsers, as a link from the login page: redirects to the
        identity provider (authorization code flow with PKCE). A short-lived
        `gantry_oidc` cookie (`HttpOnly`, `SameSite=Lax`, 10 minutes, signed
        by the agent) carries the login's state to the callback; the agent
        stores nothing.

        Errors redirect to `/login?error=<code>` instead, with the codes of
        the callback.
      security: []
      parameters:
        - name: returnTo
          in: query
          description: |
            Path of the web UI to return to after the login, such as
            `/stacks/whoami`. Only paths on this site count; anything else
            returns to `/`.
          schema:
            type: string
      responses:
        "302":
          description: To the identity provider, or to the login page with an error.
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              description: The `gantry_oidc` cookie.
              schema:
                type: string

  /api/v1/session/oidc/callback:
    get:
      operationId: finishOidcLogin
      tags: [session]
      summary: Return from the identity provider
      description: |
        The identity provider redirects here (the redirect URI is
        `GANTRY_PUBLIC_URL` plus this path). The agent exchanges the code,
        checks the ID token and the allow list (`GANTRY_OIDC_ALLOWED_GROUPS`,
        `GANTRY_OIDC_ALLOWED_EMAILS`), sets the session cookie and redirects
        to the page the login started from.

        Errors redirect to `/login?error=<code>`:

        - `oidc_denied`: the account isn't on the allow list.
        - `oidc_unavailable`: the identity provider can't be reached.
        - `oidc_failed`: anything else, such as a login older than 10
          minutes; the agent's log has the reason.
        - `oidc_disabled`: single sign-on isn't set up.
        - `https_required`: sent over plain HTTP from an internet address.
        - `too_many_attempts`: too many failed logins from this client
          within a minute.

        Failed callbacks count against the same limit as wrong tokens.
      security: []
      parameters:
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
        - name: error
          in: query
          description: Set by the identity provider if the login failed there.
          schema:
            type: string
      responses:
        "302":
          description: To the web UI, logged in, or to the login page with an error.
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              description: |
                The `gantry_session` cookie, and an expired `gantry_oidc`
                cookie.
              schema:
                type: string

  /api/v1/stacks:
    get:
      operationId: listStacks
      tags: [stacks]
      summary: List stacks
      description: |
        Lists the managed stacks (subdirectories of `GANTRY_STACKS_DIR`) and
        the other Compose projects found on the host (`managed: false`).

        If Docker is unreachable, managed stacks are still listed with status
        `unknown`, `dockerAvailable` is false, and a warning explains why.
      responses:
        "200":
          description: All known stacks, sorted by name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StackList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createStack
      tags: [stacks]
      summary: Create a stack
      description: |
        Creates a managed stack: a directory in `GANTRY_STACKS_DIR` with the
        Compose file and, if given, a `.env` file (mode 0600). The Compose
        file is validated first; nothing is written if it is invalid. The
        stack is not started; use the `start` action for that.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StackCreate"
      responses:
        "201":
          description: The stack was created.
          headers:
            Location:
              description: URL of the stack.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StackCreated"
        "400":
          description: "`invalid_name`, `invalid_compose`, `invalid_variable` or `invalid_request`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: |
            `stack_exists`: a directory or Compose project with this name
            exists. `no_file_access`: the agent may not write the stacks
            directory (see `fileAccess` in the stack list).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/TooLarge"
        "503":
          description: "`docker_unavailable`: Docker can't be reached, so it can't be checked whether a Compose project already uses the name."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/stacks/{name}:
    get:
      operationId: getStack
      tags: [stacks]
      summary: Stack details
      description: |
        Returns a stack with its services, containers and its raw Compose file.
        The Compose file is returned exactly as stored: variables such as
        `${DB_PASSWORD}` are not resolved, and `.env` files are never returned.
      parameters:
        - $ref: "#/components/parameters/StackName"
      responses:
        "200":
          description: The stack.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StackDetail"
        "400":
          $ref: "#/components/responses/InvalidName"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteStack
      tags: [stacks]
      summary: Delete a stack permanently
      description: |
        Starts an operation `delete`: `docker compose down --remove-orphans`,
        then the stack's directory is deleted **permanently**, including data
        in it such as `./data`. Named volumes are kept unless `volumes=true`
        (then `down` runs with `-v`). Like `stop` and `down`, it cancels a
        running operation first.

        `confirm` must repeat the stack name, as a guard against accidental
        calls.
      parameters:
        - $ref: "#/components/parameters/StackName"
        - name: confirm
          in: query
          required: true
          description: The stack name again.
          schema:
            type: string
        - name: volumes
          in: query
          required: false
          description: Also delete the stack's named volumes.
          schema:
            type: boolean
            default: false
      responses:
        "202":
          description: The delete operation was started.
          headers:
            Location:
              description: URL of the operation.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        "400":
          description: "`invalid_name`, or `invalid_request` if `confirm` doesn't match."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            `stack_unmanaged`, or `no_file_access`: the agent may not remove
            the stack (see `deletable` in its details); nothing was run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/volumes:
    get:
      operationId: listVolumes
      tags: [stacks]
      summary: Volumes of all stacks, with their sizes
      description: |
        The Docker volumes that belong to a Compose project (label
        `com.docker.compose.project`), with their size on disk, sorted by
        stack and name. This includes volumes left behind by stacks that no
        longer exist. Bind mounts aren't volumes and aren't included.

        Docker measures the sizes on request (`docker system df`), which can
        take a while for large volumes; the agent keeps a measurement for a
        minute, so `measuredAt` may be up to a minute old.
      responses:
        "200":
          description: The volumes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VolumeList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: "`docker_unavailable`: Docker can't be reached or didn't answer in time."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/stacks/{name}/volumes:
    get:
      operationId: getStackVolumes
      tags: [stacks]
      summary: A stack's volumes, with their sizes
      description: |
        Like `GET /api/v1/volumes`, for one Compose project, managed or not,
        with the total. A valid name without volumes gives an empty list,
        also for a stack whose directory is gone.
      parameters:
        - $ref: "#/components/parameters/StackName"
      responses:
        "200":
          description: The stack's volumes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StackVolumes"
        "400":
          $ref: "#/components/responses/InvalidName"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: "`docker_unavailable`: Docker can't be reached or didn't answer in time."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/stacks/{name}/compose:
    put:
      operationId: updateCompose
      tags: [stacks]
      summary: Save the Compose file
      description: |
        Validates the content with `docker compose config --no-interpolate`
        and then replaces the Compose file atomically. `version` must be the
        version that was read (from the stack details); if the file has
        changed since, the answer is `409 version_conflict` and nothing is
        written. The change takes effect with the next `start` or `update`.
      parameters:
        - $ref: "#/components/parameters/StackName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComposeUpdate"
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileVersion"
        "400":
          description: "`invalid_compose` (with Compose's message), `invalid_name` or `invalid_request`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            `version_conflict`, `stack_unmanaged`, or `no_file_access`: the
            agent may not write the stack's directory or read the file (see
            `fileAccess` in the stack's details).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/TooLarge"

  /api/v1/stacks/{name}/env:
    get:
      operationId: getEnv
      tags: [stacks]
      summary: Variables of the .env file (names only)
      description: |
        The names of the variables in the stack's `.env` file, never their
        values. Use `POST …/env/reveal` to read a single value on purpose.
      parameters:
        - $ref: "#/components/parameters/StackName"
      responses:
        "200":
          description: The variable names.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvFile"
        "400":
          $ref: "#/components/responses/InvalidName"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`stack_unmanaged`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateEnv
      tags: [stacks]
      summary: Set or delete variables
      description: |
        Sets and deletes variables in the stack's `.env` file, keeping its
        comments, blank lines and order; new variables are appended. Creates
        the file (mode 0600) if needed. `version` must be the version that
        was read; otherwise `409 version_conflict`. Changes take effect with
        the next `start` or `update`.
      parameters:
        - $ref: "#/components/parameters/StackName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnvUpdate"
      responses:
        "200":
          description: The updated variable names.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvFile"
        "400":
          description: "`invalid_variable`, `invalid_name` or `invalid_request`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            `version_conflict`, `stack_unmanaged`, or `no_file_access`: the
            agent may not write the stack's directory or read the file (see
            `fileAccess` in the stack's details).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/TooLarge"

  /api/v1/stacks/{name}/env/reveal:
    post:
      operationId: revealEnvValue
      tags: [stacks]
      summary: Read one variable's value
      description: |
        Returns the value of a single variable, as Compose reads it. This is
        the only way values leave the agent: one at a time, on purpose. It is
        a POST so that browsers and proxies neither prefetch nor cache it
        (the response is `Cache-Control: no-store`), and the agent logs that
        the value was revealed, never the value itself.
      parameters:
        - $ref: "#/components/parameters/StackName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnvRevealRequest"
      responses:
        "200":
          description: The value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvValue"
        "400":
          description: "`invalid_variable`, `invalid_name` or `invalid_request`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: "`not_found`: no such stack or variable."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "`stack_unmanaged`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/TooLarge"

  /api/v1/stacks/{name}/logs:
    get:
      operationId: streamStackLogs
      tags: [stacks]
      summary: Container logs (Server-Sent Events)
      description: |
        The logs of all containers of a stack in one `text/event-stream`, like
        `docker compose logs -f`: first the last `tail` lines of each
        container merged by time, then new lines as they appear. Works for
        unmanaged stacks too (read-only).

        Events:

        - `log`: `data` is a `LogLine` as JSON.
        - `end`: only with `follow=false`, after the past lines.
        - `failed`: `data` is an `Error` as JSON, e.g. when Docker can't be
          read; the stream ends after it. (Not `error`: browsers' EventSource
          uses that name for connection errors.)

        While following, containers that are started or recreated later
        (e.g. by `start`, `restart`, `update`) are picked up without
        duplicate lines. Reconnecting starts over with the past lines.

        Logs are returned as the programs wrote them, including ANSI color
        codes; they may contain anything the programs print.
      parameters:
        - $ref: "#/components/parameters/StackName"
        - name: tail
          in: query
          required: false
          description: Past lines per container.
          schema:
            type: integer
            minimum: 0
            maximum: 5000
            default: 200
        - name: follow
          in: query
          required: false
          description: Keep streaming new lines. With false the stream ends after the past lines.
          schema:
            type: boolean
            default: true
        - name: service
          in: query
          required: false
          description: Only this service's containers.
          schema:
            type: string
        - name: container
          in: query
          required: false
          description: Only this container (name).
          schema:
            type: string
      responses:
        "200":
          description: The event stream.
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/InvalidName"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/events:
    get:
      operationId: streamEvents
      tags: [stacks]
      summary: Which stacks changed, live
      description: |
        A Server-Sent Events stream that tells clients when to reload stack
        data, instead of polling. It carries no state itself; read it with
        the usual endpoints.

        - `ready` (data `{}`): sent on every connect. Reload everything, as
          changes may have been missed while disconnected.
        - `changed` (data `StackChanges`): these stacks changed, or with
          `all: true` anything may have changed (e.g. Docker was
          unreachable). Changes are collected for a quarter second, so a
          burst arrives as one event.
        - `ping` (data `{}`) every 25 seconds keeps proxies from closing an
          idle connection. A client that hears nothing for a minute or so
          should assume the connection died and reconnect.

        Changes come from Docker's container events (also for changes made
        outside gantry) and from the agent itself: operations starting and
        finishing, and files saved through the API. Files edited directly on
        the host don't cause an event. A cookie-authenticated stream ends
        with the session, and every stream ends when the agent shuts down.
      responses:
        "200":
          description: The event stream.
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/stacks/{name}/actions/{action}:
    post:
      operationId: runStackAction
      tags: [stacks]
      summary: Run an action on a stack
      description: |
        Starts an action as an asynchronous operation and returns immediately.
        Follow it with `GET /api/v1/operations/{id}` or live with
        `GET /api/v1/operations/{id}/events`.

        | Action | Compose | Effect |
        |---|---|---|
        | `start` | `up -d --remove-orphans` | Creates or updates containers to match the Compose file |
        | `stop` | `stop` | Stops containers; they are kept |
        | `restart` | `stop`, then `start` | Restarts existing containers without applying Compose file changes |
        | `update` | `pull --ignore-buildable`, then `up -d --remove-orphans` | Pulls new images and recreates changed containers |
        | `down` | `down --remove-orphans` | Removes containers and networks. Volumes are never removed |

        Only managed stacks can be changed. One operation runs per stack:
        `start`, `restart` and `update` are rejected with `stack_busy` while
        another operation runs; `stop` and `down` cancel the running
        operation first and then run (twice, to settle Docker calls the
        canceled operation had already made).
      parameters:
        - $ref: "#/components/parameters/StackName"
        - name: action
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/StackAction"
      responses:
        "202":
          description: The operation was started.
          headers:
            Location:
              description: URL of the operation.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        "400":
          description: "`invalid_name` or `invalid_action`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            `stack_busy`: another operation runs on this stack (its ID is in
            `operation`). `stack_unmanaged`: the stack isn't managed by gantry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/stacks/{name}/services/{service}/actions/{action}:
    post:
      operationId: runServiceAction
      tags: [stacks]
      summary: Run an action on one service of a stack
      description: |
        Starts an action on one service as an asynchronous operation, like
        the stack actions. gantry follows the service's dependencies
        (`depends_on`, `network_mode: service:…`, `volumes_from`) in both
        directions and hands Compose exactly the affected services, with
        `--no-deps`:

        | Action | Compose | Affected |
        |---|---|---|
        | `start` | `up -d --no-deps` | The service, and its dependencies that aren't running |
        | `stop` | `stop` | The service, and the running services that depend on it |
        | `restart` | `stop`, then `start` | The service and its running dependents; stopped dependencies are started first |
        | `update` | `pull --ignore-buildable`, then `up -d --no-deps` | Pulls and recreates the service, starts stopped dependencies, then restarts its running dependents |

        If other services than the chosen one are affected, the agent
        answers `409 confirmation_required` with the `plan`. Send the
        request again with `confirm` listing exactly the affected services
        to run it. The plan is worked out again when the action starts; if
        it changed in between, the answer is another `confirmation_required`.

        Only managed stacks can be changed. Service actions never cancel a
        running operation: while one runs, the answer is `stack_busy`.
      parameters:
        - $ref: "#/components/parameters/StackName"
        - name: service
          in: path
          required: true
          description: Service name from the Compose file.
          schema:
            type: string
            pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
        - name: action
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ServiceAction"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceActionRequest"
      responses:
        "202":
          description: The operation was started.
          headers:
            Location:
              description: URL of the operation.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        "400":
          description: "`invalid_name`, `invalid_service`, `invalid_action` or `invalid_request`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: "`not_found` (no such stack) or `service_not_found`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: |
            `confirmation_required`: other services are affected; they are
            listed in `plan`. `stack_busy`: another operation runs on this
            stack (its ID is in `operation`). `stack_unmanaged`: the stack
            isn't managed by gantry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: "`docker_unavailable`: the services' state couldn't be read."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/operations:
    get:
      operationId: listOperations
      tags: [operations]
      summary: List recent operations
      description: |
        Running operations and finished ones from the last hour, newest first,
        without output. Operations are kept in memory only.
      parameters:
        - name: stack
          in: query
          required: false
          description: Only operations of this stack.
          schema:
            type: string
      responses:
        "200":
          description: The operations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/operations/{id}:
    get:
      operationId: getOperation
      tags: [operations]
      summary: Operation with output
      parameters:
        - $ref: "#/components/parameters/OperationId"
      responses:
        "200":
          description: The operation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/operations/{id}/events:
    get:
      operationId: streamOperationEvents
      tags: [operations]
      summary: Live output (Server-Sent Events)
      description: |
        A `text/event-stream` with the operation's output so far, then each
        new line as it appears, then a final event. Reconnecting replays the
        output from the start. Events:

        - `output`: `data` is one line of Compose output.
        - `done`: `data` is the finished operation as JSON (`Operation`). The
          stream ends after it.

        Browsers' `EventSource` can't send an `Authorization` header; read
        the stream with `fetch` instead. From a terminal: `curl -N`.
      parameters:
        - $ref: "#/components/parameters/OperationId"
      responses:
        "200":
          description: The event stream.
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/operations/{id}/cancel:
    post:
      operationId: cancelOperation
      tags: [operations]
      summary: Cancel a running operation
      description: |
        Sends Compose an interrupt (like Ctrl+C) and waits briefly for it to
        stop. The stack may be left partly changed; a following `start` or
        `stop` brings it to a consistent state.
      parameters:
        - $ref: "#/components/parameters/OperationId"
      responses:
        "202":
          description: Cancellation was requested; the operation is returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`operation_finished`: the operation has already finished."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  parameters:
    StackName:
      name: name
      in: path
      required: true
      description: Compose project name.
      schema:
        type: string
        pattern: "^[a-z0-9][a-z0-9_-]*$"
    OperationId:
      name: id
      in: path
      required: true
      schema:
        type: string
        example: op_3f9c2a71b0de

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        The agent's `GANTRY_TOKEN` (not the web login's `GANTRY_UI_TOKEN`).
        Without one, bearer authentication is off. Wrong tokens count against the same limit
        as failed logins: after 10 within a minute, a client gets
        `429 too_many_attempts` with `Retry-After`, even with the right token.
    cookieAuth:
      type: apiKey
      in: cookie
      name: gantry_session
      description: >-
        Session cookie from `POST /api/v1/session`. With an `https`
        `GANTRY_PUBLIC_URL` it is named `__Host-gantry_session`.

  responses:
    Unauthorized:
      description: "`unauthorized`: missing or wrong token, or no valid session."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidName:
      description: "`invalid_name`: not a valid Compose project name."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: "`not_found`: no such stack or operation."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    TooLarge:
      description: "`request_too_large`: the request body exceeds the agent's limit."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable message.
        code:
          type: string
          description: Machine-readable reason, for clients to act on.
          enum:
            - unauthorized
            - invalid_token
            - login_disabled
            - too_many_attempts
            - origin_rejected
            - invalid_request
            - request_too_large
            - invalid_name
            - invalid_action
            - invalid_service
            - invalid_compose
            - invalid_variable
            - version_conflict
            - stack_exists
            - not_found
            - service_not_found
            - confirmation_required
            - stack_busy
            - stack_unmanaged
            - docker_unavailable
            - https_required
            - operation_finished
            - no_file_access
        operation:
          type: string
          description: For `stack_busy`, the ID of the running operation.
        plan:
          $ref: "#/components/schemas/ServiceActionPlan"

    LoginRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: The agent's `GANTRY_UI_TOKEN`.

    Session:
      type: object
      required: [method]
      properties:
        method:
          type: string
          description: How this request was authenticated.
          enum: [cookie, token]
        expiresAt:
          type: string
          format: date-time
          description: When the session cookie expires (cookie method only).
        user:
          type: string
          description: |
            Who logged in, for sessions from single sign-on: the email
            address, or else the user name or subject from the identity
            provider.

    LoginMethods:
      type: object
      required: [token, oidc]
      properties:
        token:
          type: boolean
          description: The web login token (`POST /api/v1/session`) works.
        oidc:
          type: boolean
          description: Single sign-on (`GET /api/v1/session/oidc`) works.

    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok

    Version:
      type: object
      required: [version]
      properties:
        version:
          type: string
          example: 0.1.0

    Volume:
      type: object
      required: [name, stack, driver]
      properties:
        name:
          type: string
          example: romm_data
        stack:
          type: string
          description: The Compose project the volume belongs to.
          example: romm
        driver:
          type: string
          example: local
        size:
          type: integer
          format: int64
          description: Size on disk in bytes; left out if Docker doesn't know it (e.g. other drivers than `local`).
          example: 1048576
        containers:
          type: integer
          description: How many containers use the volume; left out if Docker doesn't know it.
        createdAt:
          type: string
          format: date-time

    VolumeList:
      type: object
      required: [volumes, measuredAt]
      properties:
        volumes:
          type: array
          items:
            $ref: "#/components/schemas/Volume"
        measuredAt:
          type: string
          format: date-time
          description: When Docker measured the sizes.

    StackVolumes:
      type: object
      required: [volumes, totalSize, measuredAt]
      properties:
        volumes:
          type: array
          items:
            $ref: "#/components/schemas/Volume"
        totalSize:
          type: integer
          format: int64
          description: The sum of the known sizes, in bytes.
        measuredAt:
          type: string
          format: date-time
          description: When Docker measured the sizes.

    AgentInfo:
      type: object
      required: [version, dockerAvailable]
      properties:
        version:
          type: string
          description: The agent's version.
          example: 0.1.1
        dockerAvailable:
          type: boolean
        hostname:
          type: string
          description: The Docker host's name.
          example: nas
        operatingSystem:
          type: string
          example: Ubuntu 24.04.1 LTS
        architecture:
          type: string
          example: x86_64
        kernelVersion:
          type: string
          example: 6.8.0-48-generic
        dockerVersion:
          type: string
          description: The Docker Engine's version.
          example: 28.3.1
        composeVersion:
          type: string
          description: The version of `docker compose`, as the agent runs it.
          example: 2.39.1

    StackStatus:
      type: string
      description: |
        `running`: every service has a running container.
        `partial`: some services have a running container.
        `stopped`: no service has a running container.
        `unknown`: Docker is unreachable.
      enum: [running, partial, stopped, unknown]

    StackSummary:
      type: object
      required: [name, managed, status, servicesTotal, servicesRunning, path]
      properties:
        name:
          type: string
          description: Compose project name.
          example: whoami
        managed:
          type: boolean
          description: |
            True if the stack lives in `GANTRY_STACKS_DIR`; false for Compose
            projects found elsewhere on the host.
        status:
          $ref: "#/components/schemas/StackStatus"
        servicesTotal:
          type: integer
          description: |
            Services defined by the stack. For unmanaged stacks only the
            services that currently have containers are known.
        servicesRunning:
          type: integer
          description: Services with at least one running container.
        path:
          type: string
          description: Project directory on the host.
          example: /opt/stacks/whoami
        activeOperation:
          $ref: "#/components/schemas/ActiveOperation"

    ActiveOperation:
      type: object
      description: The operation currently running on a stack, if any.
      required: [id, action]
      properties:
        id:
          type: string
        action:
          $ref: "#/components/schemas/OperationAction"
        service:
          type: string
          description: For a service action, the chosen service.

    StackList:
      type: object
      description: |
        `fileAccess` is the access to `GANTRY_STACKS_DIR`; stacks can be
        created only if nothing is missing.
      required: [stacks, dockerAvailable, warnings, fileAccess]
      properties:
        stacks:
          type: array
          items:
            $ref: "#/components/schemas/StackSummary"
        dockerAvailable:
          type: boolean
        warnings:
          type: array
          items:
            type: string
        fileAccess:
          $ref: "#/components/schemas/FileAccess"

    FileAccess:
      type: object
      description: |
        What the agent may not read or write on the host, as the user it
        runs as. gantry never changes owners or permissions itself.
      required: [user, missing]
      properties:
        user:
          type: string
          description: The user the agent runs as; its numeric ID if it has no name.
          example: gantry
        missing:
          type: array
          items:
            $ref: "#/components/schemas/MissingAccess"

    MissingAccess:
      type: object
      required: [path, access]
      properties:
        path:
          type: string
          example: /opt/stacks/romm/.env
        access:
          type: string
          enum: [read, write]
        readOnlyFilesystem:
          type: boolean
          description: |
            True if the path is on a read-only file system, for example by a
            service sandbox; then changing its owner doesn't help.

    StackDetail:
      type: object
      description: |
        For managed stacks, `fileAccess` covers `GANTRY_STACKS_DIR`, the
        stack's directory, its Compose file and `.env`.
      required:
        - name
        - managed
        - status
        - servicesTotal
        - servicesRunning
        - path
        - services
        - volumes
        - dockerAvailable
        - warnings
        - editable
        - deletable
      properties:
        name:
          type: string
        managed:
          type: boolean
        editable:
          type: boolean
          description: |
            True if the Compose file and `.env` can be changed: the stack is
            managed, the agent may write its directory and read both files.
            Files are replaced, never written in place, so they need not be
            writable.
        deletable:
          type: boolean
          description: |
            True if the stack can be deleted: `editable`, and the agent may
            write `GANTRY_STACKS_DIR`. What the stack's directory contains
            isn't checked; files the agent may not remove stop the deletion,
            and the Compose file is removed last.
        fileAccess:
          $ref: "#/components/schemas/FileAccess"
        status:
          $ref: "#/components/schemas/StackStatus"
        servicesTotal:
          type: integer
        servicesRunning:
          type: integer
        path:
          type: string
        activeOperation:
          $ref: "#/components/schemas/ActiveOperation"
        composeFile:
          $ref: "#/components/schemas/ComposeFile"
        services:
          type: array
          items:
            $ref: "#/components/schemas/Service"
        volumes:
          type: array
          description: Named Docker volumes created for this Compose project.
          items:
            type: string
        dockerAvailable:
          type: boolean
        warnings:
          type: array
          items:
            type: string

    ComposeFile:
      type: object
      required: [path]
      properties:
        path:
          type: string
          example: /opt/stacks/whoami/compose.yaml
        content:
          type: string
          description: |
            Raw file content, variables unresolved. Omitted if the file can't
            be read by the agent.
        version:
          type: string
          description: |
            Version of the content (SHA-256), to send back when saving. Only
            set together with `content`.

    FileVersion:
      type: object
      required: [version]
      properties:
        version:
          type: string

    ComposeUpdate:
      type: object
      required: [content, version]
      properties:
        content:
          type: string
          description: The new Compose file, at most 1 MiB.
        version:
          type: string
          description: The version that was read.

    StackCreate:
      type: object
      required: [name, compose]
      properties:
        name:
          type: string
          pattern: "^[a-z0-9][a-z0-9_-]*$"
        compose:
          type: string
          description: Content of the Compose file (`compose.yaml`).
        env:
          type: object
          description: Variables for the `.env` file.
          additionalProperties:
            type: string

    StackCreated:
      type: object
      required: [name, path]
      properties:
        name:
          type: string
        path:
          type: string

    EnvVariable:
      type: object
      required: [key]
      properties:
        key:
          type: string
          example: POSTGRES_PASSWORD

    EnvFile:
      type: object
      required: [exists, version, variables]
      properties:
        exists:
          type: boolean
          description: Whether the stack has a `.env` file.
        version:
          type: string
          description: Version of the file to send back when updating ("" if it doesn't exist).
        variables:
          type: array
          items:
            $ref: "#/components/schemas/EnvVariable"

    EnvUpdate:
      type: object
      required: [version]
      properties:
        version:
          type: string
          description: The version that was read ("" if the file doesn't exist yet).
        set:
          type: object
          description: Variables to add or change. Values can't contain line breaks.
          additionalProperties:
            type: string
        delete:
          type: array
          description: Variables to remove.
          items:
            type: string

    EnvRevealRequest:
      type: object
      required: [key]
      properties:
        key:
          type: string

    EnvValue:
      type: object
      required: [key, value]
      properties:
        key:
          type: string
        value:
          type: string

    Service:
      type: object
      required: [name, containers]
      properties:
        name:
          type: string
        containers:
          type: array
          items:
            $ref: "#/components/schemas/Container"

    Container:
      type: object
      required: [id, name, state, status, health, image, ports]
      properties:
        id:
          type: string
        name:
          type: string
          example: whoami-whoami-1
        state:
          type: string
          description: Docker state, e.g. running, exited, restarting, paused.
          example: running
        status:
          type: string
          description: Human-readable status from Docker.
          example: Up 2 hours
        health:
          type: string
          enum: [healthy, unhealthy, starting, none]
        image:
          type: string
          example: traefik/whoami:latest
        ports:
          type: array
          items:
            $ref: "#/components/schemas/Port"

    LogLine:
      type: object
      description: One log line, the `data` of a `log` event.
      required: [time, service, container, stream, line]
      properties:
        time:
          type: string
          format: date-time
          description: When Docker received the line.
        service:
          type: string
          example: app
        container:
          type: string
          example: whoami-app-1
        stream:
          type: string
          enum: [stdout, stderr]
        line:
          type: string
          description: The text, without a trailing newline; cut off after 16 KiB.

    StackAction:
      type: string
      enum: [start, stop, restart, update, down]

    StackChanges:
      type: object
      description: Data of a `changed` event on `/api/v1/events`.
      required: [stacks, all]
      properties:
        stacks:
          type: array
          description: Names of the stacks that changed.
          items:
            type: string
        all:
          type: boolean
          description: Anything may have changed; reload everything.

    ServiceAction:
      type: string
      enum: [start, stop, restart, update]

    ServiceActionRequest:
      type: object
      properties:
        confirm:
          type: array
          description: |
            The affected services from a `confirmation_required` answer,
            confirming that all of them may be changed. The order doesn't
            matter.
          items:
            type: string

    ServiceActionPlan:
      type: object
      description: What a service action would change.
      required: [service, action, affected]
      properties:
        service:
          type: string
        action:
          $ref: "#/components/schemas/ServiceAction"
        affected:
          type: array
          description: Every service the action changes, the chosen one first.
          items:
            $ref: "#/components/schemas/AffectedService"

    AffectedService:
      type: object
      required: [service, effect, reason]
      properties:
        service:
          type: string
        effect:
          type: string
          description: |
            `start`: started if it isn't running. `stop`: stopped.
            `restart`: stopped and started again. `recreate`: image pulled
            and container recreated if it changed.
          enum: [start, stop, restart, recreate]
        reason:
          type: string
          description: |
            `target`: the chosen service. `dependency`: the chosen service
            needs it. `dependent`: it needs the chosen service.
          enum: [target, dependency, dependent]

    OperationAction:
      type: string
      description: What an operation does; the stack actions plus `delete`.
      enum: [start, stop, restart, update, down, delete]

    OperationStatus:
      type: string
      enum: [running, succeeded, failed, canceled]

    Operation:
      type: object
      required: [id, stack, action, status, startedAt]
      properties:
        id:
          type: string
          example: op_3f9c2a71b0de
        stack:
          type: string
          example: whoami
        action:
          $ref: "#/components/schemas/OperationAction"
        status:
          $ref: "#/components/schemas/OperationStatus"
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        exitCode:
          type: integer
          description: Exit code of the last Compose command, once finished.
        error:
          type: string
          description: Why the operation failed or was canceled.
        canceledBy:
          type: string
          description: ID of the `stop` or `down` operation that canceled this one.
        service:
          type: string
          description: For a service action, the chosen service.
        services:
          type: array
          description: For a service action, every service it changes.
          items:
            type: string

    OperationDetail:
      allOf:
        - $ref: "#/components/schemas/Operation"
        - type: object
          required: [output]
          properties:
            output:
              type: string
              description: |
                Compose output so far. Limited to the last 1 MiB; a first line
                says so if earlier output was dropped.

    OperationList:
      type: object
      required: [operations]
      properties:
        operations:
          type: array
          items:
            $ref: "#/components/schemas/Operation"

    Port:
      type: object
      required: [privatePort, type]
      properties:
        ip:
          type: string
          example: 127.0.0.1
        privatePort:
          type: integer
          example: 80
        publicPort:
          type: integer
          example: 8081
        type:
          type: string
          example: tcp
